stages:
  - install
  - test
  - build
  - analyze
  - deploy

variables:
  SONAR_HOST_URL: "http://localhost:9000"

# Cache node_modules entre jobs
cache:
  key:
    files:
      - package-lock.json
      - frontend/package-lock.json
  paths:
    - node_modules/
    - frontend/node_modules/

# ─── INSTALL ────────────────────────────────────────────────────────────────

install:backend:
  stage: install
  tags:
    - local
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/

install:frontend:
  stage: install
  tags:
    - local
  script:
    - cd frontend && npm ci
  artifacts:
    paths:
      - frontend/node_modules/

# ─── TEST ───────────────────────────────────────────────────────────────────

test:backend:
  stage: test
  tags:
    - local
  script:
    - npm test -- --coverage
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

test:frontend:
  stage: test
  tags:
    - local
  script:
    - cd frontend && npm test -- --run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── BUILD ──────────────────────────────────────────────────────────────────

build:backend:
  stage: build
  tags:
    - local
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    - if: '$CI_COMMIT_BRANCH == "main"'

build:frontend:
  stage: build
  tags:
    - local
  script:
    - cd frontend && npm run build
  artifacts:
    paths:
      - frontend/dist/
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── ANALYZE ────────────────────────────────────────────────────────────────

sonarqube:
  stage: analyze
  tags:
    - local
  script:
    - $env:SONAR_HOST = $SONAR_HOST_URL
    - $env:SONAR_TOK = $SONAR_TOKEN
    - npx sonar-scanner "-Dsonar.projectKey=gitflow-todo" "-Dsonar.projectName=GitFlow To-Do" "-Dsonar.sources=src,frontend/src" "-Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts" "-Dsonar.javascript.lcov.reportPaths=coverage/lcov.info" "-Dsonar.host.url=http://localhost:9000" "-Dsonar.token=$env:SONAR_TOK"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    - if: '$CI_COMMIT_BRANCH == "main"'

owasp-dependency-check:
  stage: analyze
  tags:
    - local
  script:
    - docker run --rm -v "%CD%:/src" -v "dependency-check-data:/usr/share/dependency-check/data" -v "%CD%/reports:/report" owasp/dependency-check:latest --scan /src --format HTML --format JSON --project "gitflow-todo" --out /report
  artifacts:
    paths:
      - reports/
    when: always
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── DEPLOY ─────────────────────────────────────────────────────────────────

deploy:staging:
  stage: deploy
  tags:
    - local
  environment:
    name: staging
  script:
    - echo "Deploying to staging... OK"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:production:
  stage: deploy
  tags:
    - local
  environment:
    name: production
  script:
    - echo "Deploying to production... OK"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  when: manual